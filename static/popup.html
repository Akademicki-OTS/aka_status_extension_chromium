<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Aka 7.6 Status</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="header-row">
    <div class="header-main">
      <span class="ext-title">Aka 7.6 Status</span>
      <button id="refresh-btn" title="Refresh now" aria-label="Refresh">⟳</button>
      <button id="mute-btn" title="Mute/unmute sound" aria-label="Mute/unmute"></button>
      <button id="theme-btn" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">🌙</button>
    </div>
  </div>

  <div id="content">
    <span class="loading">Loading...</span>
  </div>

  <div id="watchdog" style="margin:14px 0 0 0;">
    <button id="show-players-btn" class="show-players-btn">Show players</button>
    <div id="players-list" class="players-list"></div>
  
    <form id="add-watchdog-form" class="watchdog-form">
      <input id="watchdog-input" type="text" maxlength="30" placeholder="Player name">
      <button type="submit" class="btn-add">Add</button>
    </form>
  
    <div id="watchdog-list"></div>
  </div>

  <div class="footer">
    <a href="http://ots76.org/" target="_blank">ots76.org</a><br />
    <a href="https://github.com/Akademicki-OTS/aka_status_extension_chromium" target="_blank">GitHub</a>
    <div class="last-update-footer" id="last-update-footer"></div>
  </div>

  <script src="../js/popup.js"></script>
</body>

</html>
